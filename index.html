<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50 ETB Animation</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      font-family:Arial,sans-serif;
      background:linear-gradient(-45deg,#0f172a,#1e3a8a,#111827,#064e3b);
      background-size:400% 400%;
      animation:bgMove 10s ease infinite;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* Floating circles */
    .circle{
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      animation:float 8s linear infinite;
    }

    .circle:nth-child(1){
      width:120px;
      height:120px;
      left:10%;
      top:80%;
      animation-duration:12s;
    }

    .circle:nth-child(2){
      width:80px;
      height:80px;
      left:70%;
      top:90%;
      animation-duration:9s;
    }

    .circle:nth-child(3){
      width:150px;
      height:150px;
      left:85%;
      top:70%;
      animation-duration:15s;
    }

    @keyframes float{
      from{
        transform:translateY(0) rotate(0deg);
        opacity:0;
      }
      20%{opacity:1;}
      to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
      }
    }

    .card{
      position:relative;
      width:340px;
      padding:35px;
      border-radius:28px;
      text-align:center;
      color:white;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
      backdrop-filter:blur(14px);
      box-shadow:0 10px 40px rgba(0,0,0,.5);
      animation:cardFloat 4s ease-in-out infinite;
    }

    @keyframes cardFloat{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-15px); }
    }

    h1{
      font-size:30px;
      margin-bottom:10px;
      animation:glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow{
      from{ text-shadow:0 0 10px #fff; }
      to{ text-shadow:0 0 25px #22c55e,0 0 40px #22c55e; }
    }

    p{
      color:#e5e7eb;
      margin-bottom:22px;
      font-size:17px;
      animation:fadeIn 2s ease;
    }

    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(10px);}
      to{ opacity:1; transform:translateY(0);}
    }

    .money{
      font-size:48px;
      font-weight:bold;
      color:#22c55e;
      margin:25px 0;
      animation:pulse 1.2s infinite, rotateGlow 3s linear infinite;
    }

    @keyframes pulse{
      0%{ transform:scale(1); }
      50%{ transform:scale(1.15); }
      100%{ transform:scale(1); }
    }

    @keyframes rotateGlow{
      0%{ text-shadow:0 0 10px #22c55e; }
      50%{ text-shadow:0 0 30px #4ade80; }
      100%{ text-shadow:0 0 10px #22c55e; }
    }

    button{
      position:relative;
      width:100%;
      padding:15px;
      border:none;
      border-radius:16px;
      background:#22c55e;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      overflow:hidden;
      transition:.3s;
      animation:buttonBeat 1.5s infinite;
    }

    @keyframes buttonBeat{
      0%,100%{ transform:scale(1);}
      50%{ transform:scale(1.05);}
    }

    button::before{
      content:"";
      position:absolute;
      top:0;
      left:-100%;
      width:100%;
      height:100%;
      background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
      transition:.5s;
    }

    button:hover::before{
      left:100%;
    }

    button:hover{
      background:#16a34a;
      box-shadow:0 0 25px rgba(34,197,94,.8);
    }
  </style>
</head>
<body>

  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <div class="card">
    <h1>🙏 አባቴ</h1>
    <p>እባክህ 50 ETB ላክልኝ 😊</p>

    <div class="money">50 ETB</div>

    <button onclick="alert('እባክህ 50 ETB ላክ 😊')">
      💸 50 ETB ላክ
    </button>
  </div>

</body>
</html>

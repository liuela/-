<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medium Evil Challenge</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #080808;
  color: white;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.screen {
  display: none;
  width: 100%;
  max-width: 650px;
  min-height: 100vh;
  margin: auto;
  padding: 24px 16px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.screen.active {
  display: flex;
}

/* ================= PASSWORD ================= */

.lock {
  font-size: 78px;
  margin-bottom: 5px;
}

h1 {
  text-align: center;
  font-size: clamp(30px, 8vw, 50px);
  margin: 8px 0;
}

.subtitle {
  color: #aaa;
  text-align: center;
  margin: 8px 0 24px;
}

.password-box {
  width: min(100%, 360px);
}

input {
  width: 100%;
  padding: 16px;
  margin-bottom: 12px;
  border: 2px solid #333;
  border-radius: 14px;
  outline: none;
  background: #151515;
  color: white;
  text-align: center;
  font-size: 22px;
}

input:focus {
  border-color: #ff1744;
}

.main-btn,
.celebrate-btn {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #ff1744;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.main-btn:active,
.celebrate-btn:active {
  transform: scale(.97);
}

.error {
  height: 25px;
  margin-top: 10px;
  color: #ff5252;
  text-align: center;
}

/* ================= MENU ================= */

.game-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.game-card {
  min-height: 180px;
  padding: 20px;
  border: 2px solid #292929;
  border-radius: 20px;
  background: linear-gradient(145deg, #191919, #0d0d0d);
  color: white;
}

.game-card:active {
  transform: scale(.96);
}

.game-icon {
  font-size: 55px;
}

.game-name {
  margin-top: 10px;
  font-size: 20px;
  font-weight: bold;
}

.game-desc {
  margin-top: 6px;
  color: #888;
  font-size: 13px;
}

.medium {
  margin-top: 20px;
  color: #ff1744;
  font-weight: bold;
}

/* ================= GAME ================= */

.game-screen {
  justify-content: flex-start;
  padding-top: 18px;
}

.topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.back-btn {
  padding: 11px 15px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
}

.stats {
  color: #ccc;
  font-size: 14px;
  text-align: right;
}

.game-title {
  font-size: 30px;
  text-align: center;
}

/* ================= MEMORY ================= */

.memory-grid {
  width: min(92vw, 450px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.memory-tile {
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: #202020;
  color: transparent;
  font-size: 20px;
}

.memory-tile.show {
  background: #ff1744;
  color: white;
}

.memory-tile.correct {
  background: #126b42;
  color: white;
}

.memory-tile.wrong {
  background: #700018;
}

/* ================= TARGET ================= */

.target-area {
  position: relative;
  width: min(94vw, 520px);
  height: min(68vh, 480px);
  min-height: 350px;
  overflow: hidden;
  border: 3px solid #333;
  border-radius: 16px;
  background: #0c0c0c;
  touch-action: manipulation;
}

.target {
  position: absolute;
  width: 62px;
  height: 62px;
  padding: 0;
  border: 5px solid white;
  border-radius: 50%;
  background: #ff1744;
  box-shadow: 0 0 18px #ff1744;
}

/* ================= WIN ================= */

.win-icon {
  font-size: 85px;
  animation: bounce .8s infinite alternate;
}

@keyframes bounce {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-15px);
  }
}

.win-title {
  color: #00e676;
}

.win-message {
  color: #aaa;
  text-align: center;
  line-height: 1.6;
}

.celebrate-btn {
  width: min(100%, 360px);
  margin-top: 20px;
}

.play-again-btn {
  width: min(100%, 360px);
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: white;
  font-weight: bold;
}

/* ================= MOBILE ================= */

@media (max-width: 500px) {

  .screen {
    padding: 18px 12px;
  }

  .game-grid {
    gap: 10px;
  }

  .game-card {
    min-height: 160px;
    padding: 15px;
  }

  .game-icon {
    font-size: 45px;
  }

  .game-name {
    font-size: 18px;
  }

  .memory-grid {
    gap: 6px;
  }
}
</style>
</head>

<body>

<!-- ==================================================
     PASSWORD SCREEN
================================================== -->

<section id="passwordScreen" class="screen active">

  <div class="lock">🔒</div>

  <h1>EVIL CHALLENGE</h1>

  <p class="subtitle">
    Enter the password to continue.
  </p>

  <div class="password-box">

    <input
      id="passwordInput"
      type="password"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter password"
      autocomplete="off"
    >

    <button
      class="main-btn"
      onclick="checkPassword()"
    >
      UNLOCK
    </button>

    <div
      id="passwordError"
      class="error"
    ></div>

  </div>

</section>


<!-- ==================================================
     GAME MENU
================================================== -->

<section id="menuScreen" class="screen">

  <h1>CHOOSE YOUR GAME 😈</h1>

  <p class="subtitle">
    Medium Evil Mode
  </p>

  <div class="game-grid">

    <button
      class="game-card"
      onclick="startGame('memory')"
    >

      <div class="game-icon">🧠</div>

      <div class="game-name">
        Evil Memory
      </div>

      <div class="game-desc">
        Memorize the pattern and reproduce it.
      </div>

    </button>


    <button
      class="game-card"
      onclick="startGame('target')"
    >

      <div class="game-icon">🎯</div>

      <div class="game-name">
        Target Shooting
      </div>

      <div class="game-desc">
        Hit moving targets before time runs out.
      </div>

    </button>

  </div>

  <div class="medium">
    ⚠️ DIFFICULTY: MEDIUM ⚠️
  </div>

</section>


<!-- ==================================================
     GAME SCREEN
================================================== -->

<section
  id="gameScreen"
  class="screen game-screen"
>

  <div class="topbar">

    <button
      class="back-btn"
      onclick="backToMenu()"
    >
      ← Games
    </button>

    <div
      id="stats"
      class="stats"
    ></div>

  </div>

  <h2
    id="gameTitle"
    class="game-title"
  ></h2>


  <!-- MEMORY GAME -->

  <div
    id="memoryGame"
    style="display:none;text-align:center;width:100%"
  >

    <div
      id="memoryGrid"
      class="memory-grid"
    ></div>

    <p id="memoryMessage">
      Watch the pattern...
    </p>

  </div>


  <!-- TARGET GAME -->

  <div
    id="targetGame"
    style="display:none;text-align:center;width:100%"
  >

    <div
      id="targetArea"
      class="target-area"
    >

      <button
        id="target"
        class="target"
        aria-label="Target"
      ></button>

    </div>

    <p>
      Hit <b>12 targets</b> before time runs out.
    </p>

  </div>

</section>


<!-- ==================================================
     WIN SCREEN
================================================== -->

<section id="winScreen" class="screen">

  <div class="win-icon">🏆</div>

  <h1 class="win-title">
    YOU WON!
  </h1>

  <p class="win-message">
    You survived Medium Evil Mode! 😈
  </p>

  <button
    class="celebrate-btn"
    onclick="celebrate()"
  >
    🎉 CELEBRATE 🎉
  </button>

  <button
    class="play-again-btn"
    onclick="playAgain()"
  >
    🔒 PLAY AGAIN
  </button>

</section>


<script>

/* ==================================================
   SETTINGS
================================================== */

const PASSWORD = "1234";

const TIKTOK_URL =
  "https://vt.tiktok.com/ZSVYwdjXN/";

let currentGame = null;


/* ==================================================
   SCREEN SYSTEM
================================================== */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");
}


/* ==================================================
   PASSWORD
================================================== */

function checkPassword() {

  const input =
    document.getElementById("passwordInput").value;

  const error =
    document.getElementById("passwordError");


  if (input === PASSWORD) {

    error.textContent = "";

    document
      .getElementById("passwordInput")
      .value = "";

    showScreen("menuScreen");

  } else {

    error.textContent =
      "❌ Wrong password";

    document
      .getElementById("passwordInput")
      .value = "";

  }

}


document
  .getElementById("passwordInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        checkPassword();
      }

    }
  );


/* ==================================================
   START GAME
================================================== */

function startGame(game) {

  stopAllGames();

  currentGame = game;

  showScreen("gameScreen");


  document
    .getElementById("memoryGame")
    .style.display = "none";

  document
    .getElementById("targetGame")
    .style.display = "none";


  if (game === "memory") {

    document
      .getElementById("gameTitle")
      .textContent = "🧠 EVIL MEMORY";

    document
      .getElementById("memoryGame")
      .style.display = "block";

    startMemory();

  }


  if (game === "target") {

    document
      .getElementById("gameTitle")
      .textContent = "🎯 TARGET SHOOTING";

    document
      .getElementById("targetGame")
      .style.display = "block";

    startTarget();

  }

}


/* ==================================================
   WIN
================================================== */

function winGame() {

  stopAllGames();

  showScreen("winScreen");

}


/* ==================================================
   PLAY AGAIN
================================================== */

function playAgain() {

  stopAllGames();

  /*
    Going back to the password screen
    means the player must enter 1234 again.
  */

  document
    .getElementById("passwordInput")
    .value = "";

  document
    .getElementById("passwordError")
    .textContent = "";

  showScreen("passwordScreen");

}


/* ==================================================
   CELEBRATE
================================================== */

function celebrate() {

  window.location.href =
    TIKTOK_URL;

}


/* ==================================================
   BACK TO MENU
================================================== */

function backToMenu() {

  stopAllGames();

  /*
    Going back to menu does not require
    another password because the player
    is still inside the current session.
  */

  showScreen("menuScreen");

}


function updateStats(text) {

  document
    .getElementById("stats")
    .textContent = text;

}


/* ==================================================
   EVIL MEMORY
   MEDIUM DIFFICULTY
================================================== */

const memoryGrid =
  document.getElementById("memoryGrid");

const memoryMessage =
  document.getElementById("memoryMessage");

let memorySequence = [];
let memoryStep = 0;
let memoryRound = 1;
let memoryTimer = null;


function startMemory() {

  memoryRound = 1;

  createMemoryRound();

}


function createMemoryRound() {

  clearTimeout(memoryTimer);

  memoryGrid.innerHTML = "";

  memoryStep = 0;

  const totalTiles = 16;

  /*
    Medium:

    Round 1 = 3 tiles
    Round 2 = 4 tiles
    Round 3 = 5 tiles
    Round 4 = 6 tiles
  */

  const sequenceLength =
    2 + memoryRound;

  memorySequence = [];


  while (
    memorySequence.length <
    sequenceLength
  ) {

    const index =
      Math.floor(
        Math.random() * totalTiles
      );

    if (
      !memorySequence.includes(index)
    ) {

      memorySequence.push(index);

    }

  }


  const buttons = [];


  for (
    let i = 0;
    i < totalTiles;
    i++
  ) {

    const button =
      document.createElement("button");

    button.className =
      "memory-tile";

    button.textContent = "◆";

    button.onclick =
      function() {

        memoryClick(
          i,
          button
        );

      };

    memoryGrid.appendChild(button);

    buttons.push(button);

  }


  updateStats(
    "Round " +
    memoryRound +
    " / 4"
  );


  memoryMessage.textContent =
    "👀 Memorize the red tiles!";


  memorySequence.forEach(
    index => {

      buttons[index]
        .classList
        .add("show");

    }
  );


  memoryTimer =
    setTimeout(
      function() {

        buttons.forEach(
          button => {

            button
              .classList
              .remove("show");

          }
        );

        memoryMessage.textContent =
          "😈 Reproduce the pattern!";

      },
      1400
    );

}


function memoryClick(
  index,
  button
) {

  if (
    button
      .classList
      .contains("correct")
  ) {

    return;

  }


  if (
    index ===
    memorySequence[memoryStep]
  ) {

    button
      .classList
      .add("correct");

    memoryStep++;


    if (
      memoryStep ===
      memorySequence.length
    ) {

      if (
        memoryRound >= 4
      ) {

        winGame();

      } else {

        memoryRound++;

        memoryMessage.textContent =
          "✅ Correct! Next round...";

        setTimeout(
          createMemoryRound,
          700
        );

      }

    }

  } else {

    button
      .classList
      .add("wrong");

    memoryMessage.textContent =
      "❌ Wrong! Try this round again.";

    setTimeout(
      createMemoryRound,
      800
    );

  }

}


/* ==================================================
   TARGET SHOOTING
   MEDIUM DIFFICULTY
================================================== */

const target =
  document.getElementById("target");

const targetArea =
  document.getElementById("targetArea");

let targetScore = 0;
let targetTime = 25;
let targetTimer = null;
let targetMoveTimer = null;


function startTarget() {

  targetScore = 0;

  targetTime = 25;

  moveTarget();

  updateTargetStats();


  targetMoveTimer =
    setInterval(
      moveTarget,
      900
    );


  targetTimer =
    setInterval(
      function() {

        targetTime--;

        updateTargetStats();


        if (
          targetTime <= 0
        ) {

          stopTarget();

          alert(
            "⏰ Time's up! Try again."
          );

          startTarget();

        }

      },
      1000
    );

}


function updateTargetStats() {

  updateStats(
    "Hits: " +
    targetScore +
    " / 12 | Time: " +
    targetTime
  );

}


function moveTarget() {

  const maxX =
    targetArea.clientWidth - 62;

  const maxY =
    targetArea.clientHeight - 62;


  const x =
    Math.random() *
    Math.max(1, maxX);

  const y =
    Math.random() *
    Math.max(1, maxY);


  target.style.left =
    x + "px";

  target.style.top =
    y + "px";

}


target.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    targetScore++;

    updateTargetStats();


    if (
      targetScore >= 12
    ) {

      winGame();

      return;

    }


    moveTarget();

  }
);


function stopTarget() {

  clearInterval(targetTimer);

  clearInterval(targetMoveTimer);

  targetTimer = null;

  targetMoveTimer = null;

}


/* ==================================================
   STOP ALL GAMES
================================================== */

function stopAllGames() {

  clearTimeout(memoryTimer);

  memoryTimer = null;

  stopTarget();

}

</script>

</body>
</html>
